name: Train and save SPY42 model

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/train-spy42-model.yml
      - .github/scripts/train_spy42_model.py
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: spy42-model-v1
  cancel-in-progress: false

jobs:
  train-and-save:
    if: github.repository == 'jamelof23/SPY' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install matched CPU training packages
        run: |
          python -m pip install --disable-pip-version-check torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==2.3.5 pandas==2.3.3 Pillow==13.0.0 requests==2.32.5 matplotlib==3.10.8

      - name: Train the reviewed model and save it to GitHub Releases
        timeout-minutes: 300
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
          OPENBLAS_NUM_THREADS: "1"
        run: python -u .github/scripts/train_spy42_model.py

      - name: Preserve available outputs if training or publication fails
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: spy42-model-v1-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 2
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/spy42_model_training/local_runs/
            ${{ runner.temp }}/spy42_model_training/local_run_contexts/
            ${{ runner.temp }}/spy42_model_training/model_artifacts/
            ${{ runner.temp }}/spy42_model_training/logs/
